name: build

# Every push and PR compiles the firmware. A version tag (v*) also publishes a
# release with both install images and the M5Burner layout.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          # 3.x: vendor/libs holds the 3.x-compatible AsyncTCP/ESPAsyncWebServer copies.
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install M5Cardputer

      - name: Build
        run: |
          chmod +x tools/*.sh
          tools/build.sh

      - name: Package for M5Burner
        run: tools/package-m5burner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-arcade-cardputer
          path: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
            firmware/cardputer/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/hotspot-arcade-cardputer.ino.bin
            build/hotspot-arcade-cardputer.full.bin
          # Release notes come from a repo file, so they're version-controlled and a
          # workflow re-run can never clobber hand-written notes. Edit
          # docs/RELEASE_NOTES.md and commit it before tagging the next release.
          body_path: docs/RELEASE_NOTES.md

      # Push the release to M5Burner too, which mirrors into LauncherHub. Runs only
      # when the two secrets are set (add them under Settings -> Secrets -> Actions):
      #   M5BURNER_USER  M5BURNER_PWD   (an M5Stack community account)
      # Uses bmorcelli's m5burner_post.py; the fid is baked into tools/m5burner_post.py.
      - name: Publish to M5Burner
        if: startsWith(github.ref, 'refs/tags/v') && env.M5BURNER_USER != ''
        env:
          M5BURNER_USER: ${{ secrets.M5BURNER_USER }}
          M5BURNER_PWD: ${{ secrets.M5BURNER_PWD }}
        run: |
          python3 -m pip install --quiet requests
          python3 tools/m5burner_post.py \
            --user "$M5BURNER_USER" --password "$M5BURNER_PWD" \
            --tag "${GITHUB_REF_NAME}" --artifacts-dir build
